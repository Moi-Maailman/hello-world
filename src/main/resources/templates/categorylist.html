<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid p-3">
        <h1 class="display-4 mb-4">Categories</h1>

        <table class="table align-middle" th:unless="${#lists.isEmpty(categories)}">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="category : ${categories}">
                    <td th:text="${category.name}"></td>
                    <td th:text="${category.description != null ? category.description : '-'}"></td>
                    <td>
                        <form th:action="@{/deletecategory/{id}(id=${category.id})}" method="post">
                            <button type="submit" class="btn btn-danger">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <p th:if="${#lists.isEmpty(categories)}" class="text-muted">No categories have been added yet.</p>

        <div class="d-flex gap-2">
            <a th:href="@{/addcategory}" class="btn btn-primary">Add a category</a>
            <a th:href="@{/quizlist}" class="btn btn-secondary">Back to quizzes</a>
        </div>
    </div>
</body>

</html>
