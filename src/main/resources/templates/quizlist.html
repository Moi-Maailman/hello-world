<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Quiz List</title>
</head>

<body>
    <h1>Quiz List</h1>
    <a th:href="@{/addquiz}">Add Quiz</a>

    <table>
        <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Course Code</th>
            <th>Published</th>
            <th>Created At</th>
            <th>Actions</th>
        </tr>

        <tr th:each="quiz : ${quizzes}">
            <td th:text="${quiz.name}"></td>
            <td th:text="${quiz.description}"></td>
            <td th:text="${quiz.courseCode}"></td>
            <td th:text="${quiz.published}"></td>
            <td th:text="${quiz.createdAt}"></td>
            <td>
                <a th:href="@{/editquiz/{id}(id=${quiz.id})}">Edit</a>
                <a th:href="@{/addquestion/{id}(id=${quiz.id})}">Add question</a>
                <form th:action="@{/deletequiz/{id}(id=${quiz.id})}" method="post" style="display:inline">
                    <button type="submit">Delete</button>
                </form>
            </td>
        </tr>
    </table>
</body>

</html>
