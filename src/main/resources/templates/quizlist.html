<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Quizzes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid p-3">
        <h1 class="display-4 mb-4">Quizzes</h1>

        <table class="table align-middle">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Description</th>
                    <th>Course</th>
                    <th>Published</th>
                    <th>Added on</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="quiz : ${quizzes}">
                    <td>
                        <a th:href="@{/questionlist/{id}(id=${quiz.id})}" th:text="${quiz.name}"></a>
                    </td>
                    <td th:text="${quiz.description}"></td>
                    <td th:text="${quiz.courseCode}"></td>

                    <td>
                        <span th:if="${quiz.published}" class="badge bg-primary">
                            Published
                        </span>

                        <span th:unless="${quiz.published}" class="badge bg-secondary">
                            Not published
                        </span>
                    </td>

                    <td th:text="${#temporals.format(quiz.createdAt, 'dd.MM.yyyy')}"></td>

                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/editquiz/{id}(id=${quiz.id})}" class="btn btn-secondary">
                                Edit
                            </a>

                            <form th:action="@{/deletequiz/{id}(id=${quiz.id})}" method="post">
                                <button type="submit" class="btn btn-danger">
                                    Delete
                                </button>
                            </form>

                            <a th:href="@{/addquestion/{id}(id=${quiz.id})}" class="btn btn-primary">
                                Add question
                            </a>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/addquiz}" class="btn btn-primary">
            Add a quiz
        </a>
    </div>
</body>

</html>
