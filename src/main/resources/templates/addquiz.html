<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid p-3">

        <h1 class="display-4 mb-4">Add a quiz</h1>

        <form th:action="@{/savequiz}" th:object="${quiz}" method="post">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" th:field="*{name}" class="form-control" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
            </div>

            <div class="mb-3">
                <label class="form-label">Course code</label>
                <input type="text" th:field="*{courseCode}" class="form-control" />
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{published}" class="form-check-input" />
                <label class="form-check-label">
                    Published
                </label>
            </div>

            <button type="submit" class="btn btn-primary">
                Add
            </button>

            <a th:href="@{/quizlist}" class="btn btn-secondary">
                Cancel
            </a>

        </form>
    </div>
</body>

</html>
