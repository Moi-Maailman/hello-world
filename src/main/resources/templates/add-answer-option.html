<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Answer Option</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid p-3">

        <h1 class="display-4 mb-4">Add an answer option</h1>

        <p class="text-muted">
            Question:
            <span th:text="${question.text}"></span>
        </p>

        <form th:action="@{/questions/{id}/answer-options(id=${question.id})}" th:object="${answerOption}"
            method="post">

            <div class="mb-3">
                <label class="form-label">Answer option text</label>
                <input type="text" th:field="*{text}" class="form-control" required />
            </div>

            <div class="form-check mb-3">
                <input type="checkbox" th:field="*{correct}" class="form-check-input" />
                <label class="form-check-label">
                    Correct
                </label>
            </div>

            <button type="submit" class="btn btn-primary">
                Add answer option
            </button>

            <a th:href="@{/questions/{id}/answer-options(id=${question.id})}" class="btn btn-secondary">
                Cancel
            </a>

        </form>
    </div>
</body>

</html>
