<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Questions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid p-3">
        <h1 class="display-4 mb-4">Questions of "<span th:text="${quiz.name}"></span>"</h1>

        <table class="table align-middle" th:unless="${#lists.isEmpty(questions)}">
            <thead>
                <tr>
                    <th>Question text</th>
                    <th>Difficulty</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="question : ${questions}">
                    <td>
                        <a th:href="@{/questions/{id}/answer-options(id=${question.id})}"
                            th:text="${question.text}"></a>
                    </td>
                    <td th:text="${question.difficulty}"></td>
                    <td>
                        <div class="d-flex gap-2">
                            <a th:href="@{/questions/{id}/answer-options(id=${question.id})}" class="btn btn-secondary">
                                Answer options
                            </a>
                            <form th:action="@{/deletequestion/{id}(id=${question.id})}" method="post">
                                <button type="submit" class="btn btn-danger">Delete</button>
                            </form>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <p th:if="${#lists.isEmpty(questions)}" class="text-muted">This quiz has no questions yet.</p>

        <div class="d-flex gap-2">
            <a th:href="@{/addquestion/{id}(id=${quiz.id})}" class="btn btn-primary">Add a question</a>
            <a th:href="@{/quizlist}" class="btn btn-secondary">Back to quizzes</a>
        </div>
    </div>
</body>

</html>
