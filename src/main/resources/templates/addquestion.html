<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Add Question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid p-3">

        <h1 class="display-4 mb-4">Add a question</h1>

        <p class="text-muted">
            Quiz:
            <span th:text="${quiz.name}"></span>
        </p>

        <form th:action="@{/savequestion/{id}(id=${quiz.id})}" th:object="${question}" method="post">

            <div class="mb-3">
                <label class="form-label">Question text</label>
                <input type="text" th:field="*{text}" class="form-control" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Difficulty</label>
                <select th:field="*{difficulty}" class="form-select">
                    <option th:each="d : ${difficulties}" th:value="${d}" th:text="${d}">
                    </option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                Add
            </button>

            <a th:href="@{/questionlist/{id}(id=${quiz.id})}" class="btn btn-secondary">
                Cancel
            </a>

        </form>
    </div>
</body>

</html>
