<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Answer Options</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid p-3">

        <h1 class="display-4 mb-4">Answer options</h1>

        <p class="text-muted" th:text="${question.text}"></p>

        <table class="table">
            <thead>
                <tr>
                    <th>Answer option</th>
                    <th>Correct</th>
                    <th></th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="option : ${answerOptions}">
                    <td th:text="${option.text}"></td>

                    <td>
                        <span th:if="${option.correct}" class="badge bg-primary">
                            Yes
                        </span>

                        <span th:unless="${option.correct}" class="badge bg-secondary">
                            No
                        </span>
                    </td>

                    <td>
                        <form th:action="@{/answer-options/{id}/delete(id=${option.id})}" method="post">
                            <button type="submit" class="btn btn-danger">
                                Delete
                            </button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <a th:href="@{/questions/{id}/answer-options/new(id=${question.id})}" class="btn btn-primary">
            Add an answer option
        </a>

        <a th:href="@{/questionlist/{id}(id=${question.quiz.id})}" class="btn btn-secondary">
            Back to questions
        </a>

    </div>
</body>

</html>
