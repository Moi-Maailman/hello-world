<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Edit Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container-fluid p-3">
        <h1 class="display-4 mb-4">Edit category</h1>

        <form th:action="@{/updatecategory}" th:object="${category}" method="post">
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
                <label class="form-label">Category name</label>
                <input type="text" th:field="*{name}" class="form-control" required />
            </div>

            <div class="mb-3">
                <label class="form-label">Description</label>
                <textarea th:field="*{description}" class="form-control" rows="3" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Save</button>
            <a th:href="@{/categorylist}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</body>

</html>
